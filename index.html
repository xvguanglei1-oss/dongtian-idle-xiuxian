<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>洞天 · 挂机修仙</title>
<meta name="description" content="洞天挂机修仙：分身自动历险、自动寻宝穿装，离线亦在成长。">
<link rel="icon" href="data:,">
<style>
  :root{
    --gold:#e8c56b; --gold-dim:#b8953f; --ink:#0b1020; --text:#e8ecf6; --dim:#93a0b8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:#070b16;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .bg-img{position:fixed;inset:0;background:center/cover no-repeat url(assets/main-bg.jpg);opacity:.14;z-index:1;filter:saturate(1.1)}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 8%, transparent 40%, rgba(4,8,18,.55) 100%),
      linear-gradient(180deg, rgba(5,8,18,.35), transparent 30%, transparent 70%, rgba(4,6,14,.72))}

  /* ---- HUD ---- */
  .hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:14px 16px 8px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .realm-badge{background:rgba(12,18,34,.72);border:1px solid rgba(232,197,107,.35);backdrop-filter:blur(8px);
    padding:7px 13px;border-radius:999px;display:flex;flex-direction:column;gap:1px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .realm-badge .big{font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--gold);line-height:1.2;text-shadow:0 0 12px rgba(232,197,107,.45)}
  .realm-badge .sub{font-size:10px;color:var(--dim);letter-spacing:.04em}
  .story-btn{margin-top:6px;align-self:flex-start;pointer-events:auto;font-size:10px;padding:3px 10px;border-radius:999px;
    border:1px solid rgba(232,197,107,.32);background:rgba(232,197,107,.12);color:var(--gold);letter-spacing:.08em;
    cursor:pointer;backdrop-filter:blur(4px);transition:transform .12s}
  .story-btn:active{transform:scale(.92)}
  .hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .spirit{background:rgba(12,18,34,.72);border:1px solid rgba(232,197,107,.3);border-radius:999px;padding:6px 12px;
    font-size:13px;font-weight:700;color:#7fe0c3;display:flex;gap:5px;align-items:center}
  .rate{font-size:11px;color:var(--dim);background:rgba(12,18,34,.6);padding:5px 10px;border-radius:999px}
  .rate b{color:#8fb6ff}

  /* 修为进度 */
  .exp-wrap{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
  .exp-track{position:relative;height:13px;border-radius:999px;background:rgba(10,16,32,.75);border:1px solid rgba(255,255,255,.08);overflow:hidden;backdrop-filter:blur(6px)}
  .exp-fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#1f3a6e,#3f6bb5 55%,#7fb3ff);box-shadow:0 0 14px rgba(120,180,255,.7)}
  .exp-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim)}
  .exp-labels b{color:#9fc3ff;font-weight:700}

  /* 主角 */
  .stage{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
  .cult{position:relative;height:min(54vh,430px);aspect-ratio:825/835;filter:drop-shadow(0 0 30px rgba(120,170,255,.22))}
  .cult img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 88%}
  .cult .hair{animation:breath 4.6s ease-in-out infinite}
  .cult .bodyL{animation:breath 4.6s ease-in-out infinite}
  .cult .robe{animation:breath 4.6s ease-in-out infinite}
  .aura{position:absolute;left:50%;top:50%;width:210%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.5;
    background:radial-gradient(circle,rgba(120,170,255,.30),rgba(120,170,255,.06) 42%,transparent 68%);
    animation:auraPulse 3.8s ease-in-out infinite}
  .orbit{position:absolute;left:50%;top:46%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
  .glow-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px 2px rgba(232,197,107,.75);animation:orbitDot 7s linear infinite}
  @keyframes breath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.6%) scaleY(1.006)}}
  @keyframes auraPulse{0%,100%{opacity:.38;transform:translate(-50%,-50%) scale(.96)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.06)}}
  @keyframes orbitDot{from{transform:rotate(0deg) translateX(46%) rotate(0)}to{transform:rotate(360deg) translateX(46%) rotate(-360deg)}}

  /* 中央按钮 */
  .actions{position:fixed;left:0;right:0;bottom:58px;z-index:10;display:flex;justify-content:center;gap:10px;padding:0 14px}
  .btn{pointer-events:auto;border:1px solid rgba(232,197,107,.42);background:linear-gradient(180deg,rgba(232,197,107,.16),rgba(120,90,20,.12));
    color:var(--gold);border-radius:14px;padding:11px 18px;font-size:14px;font-weight:800;letter-spacing:.06em;
    backdrop-filter:blur(6px);cursor:pointer;transition:transform .12s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .btn:active{transform:scale(.94)}
  .btn.primary{background:linear-gradient(180deg,#f0cf7c,#b8943a);color:#241a02;border-color:rgba(255,220,140,.7);
    box-shadow:0 0 22px rgba(240,200,110,.5)}
  .btn:disabled{opacity:.4}
  .btn.ready{animation:btnPulse 1.7s ease-in-out infinite;border-color:rgba(255,228,160,.95);box-shadow:0 0 18px rgba(240,205,120,.35)}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 12px rgba(240,205,120,.35)}50%{box-shadow:0 0 28px rgba(240,205,120,.95)}}

  /* 双栏叙事流: 左=分身经历(低对比·渐隐·不抢视觉)  右=主角主线探险游历 */
  .feed{position:fixed;bottom:114px;z-index:9;display:flex;flex-direction:column-reverse;gap:7px;
    pointer-events:none;width:min(196px,42vw);max-height:200px;overflow:hidden}
  .feed-avatar{left:10px}
  .feed-main{right:10px}
  .fmsg{padding:7px 11px;border-radius:11px;font-size:11.5px;line-height:1.55;
    overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;
    background:rgba(10,16,30,.32);backdrop-filter:blur(4px);transform-origin:bottom center;
    will-change:opacity,transform}
  .fmsg .r{color:#d9b45f;font-weight:700}
  .fmsg .g{color:#7fe0c3;font-weight:700}
  .fmsg .b{color:#8fb6ff;font-weight:700}
  /* 左·分身: 灰字低存在感, 渐显后缓缓上浮消散 */
  .feed-avatar .fmsg{color:#a3b1c9;background:rgba(8,12,22,.40);font-size:11px;
    animation:msgLifeA 6s cubic-bezier(.2,.55,.45,1) forwards}
  .feed-avatar .fmsg .r{color:#a8904f}
  .feed-avatar .fmsg .g{color:#5aa88e}
  /* 右·主线: 清晰金色主视觉 */
  .feed-main .fmsg{color:#e6ebf6;background:rgba(14,20,36,.55);font-size:11.5px;
    animation:msgLifeM 9s ease forwards}
  @keyframes msgLifeA{0%{opacity:0;transform:translateY(7px) scale(.97)}10%{opacity:.7}18%{opacity:.95}
    70%{opacity:.78}100%{opacity:0;transform:translateY(-12px)}}
  @keyframes msgLifeM{0%{opacity:0;transform:translateY(8px)}8%{opacity:.98}80%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}

  /* 突破特效 */
  #burst{position:fixed;inset:0;z-index:30;pointer-events:none}
  .flash{position:fixed;inset:0;z-index:31;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,#fff8e0,rgba(255,230,150,.25) 45%,transparent 75%)}
  .realm-up{position:fixed;left:0;right:0;top:34%;z-index:32;text-align:center;pointer-events:none;opacity:0}
  .realm-up .t{font-size:40px;font-weight:900;letter-spacing:.3em;color:#ffe9a8;text-shadow:0 0 30px rgba(255,220,130,.9);padding-left:.3em}
  .realm-up .s{font-size:13px;color:#9fc3ff;margin-top:6px;letter-spacing:.2em}
  .realm-up.show{animation:realmUp 2.6s ease-out forwards}
  @keyframes realmUp{0%{opacity:0;transform:scale(.6)}14%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.06)}}

  /* 离线弹窗 */
  .modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(4,7,15,.66);backdrop-filter:blur(4px)}
  .modal.show{display:flex}
  .card{background:linear-gradient(180deg,#101a30,#0a1122);border:1px solid rgba(232,197,107,.35);border-radius:18px;
    padding:24px 22px;max-width:300px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .card h3{color:var(--gold);font-size:18px;letter-spacing:.14em;margin-bottom:12px}
  .card p{font-size:13px;color:var(--dim);line-height:1.8}
  .card .num{color:#7fe0c3;font-weight:800;font-size:17px}
  .card .btn{margin-top:16px;width:100%}

  /* 剧情纲目弹层 */
  .story-card{max-width:440px;width:94%;height:min(88vh,780px);display:flex;flex-direction:column;
    padding:16px 16px 14px;text-align:left;overflow:hidden}
  .story-card h3{margin-bottom:3px}
  .story-tip{font-size:10.5px;color:var(--dim);margin-bottom:4px;line-height:1.6}
  .chips-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips-row::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid rgba(232,197,107,.28);
    background:rgba(232,197,107,.10);color:#d9b45f;cursor:pointer;white-space:nowrap;transition:background .15s}
  .chip.on{background:rgba(232,197,107,.30);color:#ffe9a8}
  .story-body{flex:1;overflow-y:auto;padding:2px 8px 8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .story-body section{margin:16px 0;scroll-margin-top:4px}
  .story-body section:first-child{margin-top:4px}
  .story-body h4{color:var(--gold);font-size:13px;letter-spacing:.05em;margin:0 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .story-body h4 .vol{font-size:9.5px;color:#9fc3ff;font-weight:600;letter-spacing:.06em}
  .story-body p{font-size:12px;color:#cdd6e6;line-height:1.85;margin:0 0 9px;text-align:justify}
  .story-close{width:100%;margin-top:10px;flex:none}
  .story-sum{font-size:11px;color:#9fc3ff;margin:0 0 10px;line-height:1.7}
  .story-sum b{color:#e8c56b}
  .j-card{position:relative;margin:0 0 10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);
    border-left:2px solid rgba(232,197,107,.55);box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .j-card.k-开篇{border-left-color:#7fe0c3}
  .j-card.k-游历{border-left-color:#5f8fe6;opacity:.9}
  .j-card.k-纪事{border-left-color:#c59bff}
  .j-head{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
  .j-big{font-size:9px;color:#9fc3ff;border:1px solid rgba(127,143,255,.35);padding:1px 7px;border-radius:999px}
  .j-kind{font-size:9px;padding:1px 7px;border-radius:999px;background:rgba(232,197,107,.13);color:#e8c56b}
  .j-kind.k-开篇{background:rgba(127,224,195,.13);color:#7fe0c3}
  .j-kind.k-游历{background:rgba(95,143,230,.14);color:#9fc3ff}
  .j-kind.k-纪事{background:rgba(197,155,255,.15);color:#c59bff}
  .j-time{margin-left:auto;font-size:9px;color:#6d7a94}
  .j-card h5{font-size:13px;color:#f3e7c4;margin:0 0 5px;font-weight:800;letter-spacing:.02em}
  .j-card p{font-size:11.5px;line-height:1.8;color:#c2cdde;margin:0;text-align:justify}
  .empty-hint{padding:26px 12px;text-align:center;color:#7a87a2;font-size:12px;line-height:2}
  .off-tale{margin-top:11px;padding:9px 11px;border-radius:10px;background:rgba(95,143,230,.10);
    font-size:11.5px;color:#bcd0f2;line-height:1.75;text-align:left}
  .off-tale b{color:#9fc3ff}

  .artifacts{position:fixed;left:0;right:0;top:96px;z-index:9;display:flex;justify-content:center;padding:0 10px}
  .art-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:520px}
  .art{font-size:10.5px;padding:4px 9px;border-radius:8px;background:rgba(12,18,34,.40);border:1px solid rgba(255,255,255,.07);
    color:#d8dff0;backdrop-filter:blur(5px);display:flex;gap:4px;align-items:center}
  .art .q{font-weight:800}
  .q1{color:#b9c2d4}.q2{color:#5d9e5f}.q3{color:#5f8fe6}.q4{color:#b06ce0}.q5{color:#e8a13c}.q6{color:#ff5c5c}
  .art.new{animation:artIn .9s ease-out}
  @keyframes artIn{0%{transform:scale(.55);box-shadow:0 0 0 rgba(232,197,107,0)}40%{transform:scale(1.06);
    box-shadow:0 0 16px 2px rgba(232,197,107,.65)}100%{transform:scale(1);box-shadow:0 0 6px rgba(232,197,107,.28)}}

  /* WebGL 降级: 纯 CSS 星空 */
  body.no-webgl::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(232,197,107,.8), transparent),
      radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 10% 80%, rgba(159,195,255,.8), transparent),
      radial-gradient(1px 1px at 55% 90%, rgba(255,255,255,.5), transparent),
      radial-gradient(ellipse 90% 70% at 50% 0%, #0d1830 0%, transparent 60%);
  }
</style>

<body>
<canvas id="bg"></canvas>
<div class="bg-img"></div>
<div class="vignette"></div>

<div class="hud">
  <div class="realm-badge"><span class="big" id="realmName">凡人</span><span class="sub" id="realmSub">练气初期 · 洞天福地</span><button class="story-btn" onclick="openStory()">📜 剧情纲目</button></div>
  <div class="hud-right">
    <div class="spirit">🪙 <span id="spirit">0</span></div>
    <div class="rate">修为 <b id="rateText">0</b>/秒</div>
  </div>
</div>

<div class="artifacts"><div class="art-row" id="artRow"></div></div>

<div class="stage">
  <div class="cult" id="cult">
    <div class="aura"></div>
    <img class="bodyL" src="assets/cultivator_body.png" alt="">
    <img class="robe" src="assets/cultivator_robe.png" alt="">
    <img class="hair" src="assets/cultivator_hair.png" alt="">
  </div>
</div>

<!-- 左:分身经历(渐隐低存在感)  右:主角主线游历 -->
<div class="feed feed-avatar" id="avatarFeed"></div>
<div class="feed feed-main" id="mainFeed"></div>
<div class="actions">
  <button class="btn" id="btnArray" onclick="tapArray()">聚灵阵 Lv.<span id="arrayLv">1</span></button>
  <button class="btn primary" id="btnBreak" onclick="manualBreak()">☯ 立即突破</button>
</div>

<div class="exp-wrap">
  <div class="exp-labels"><span>境界进度</span><span><b id="expText">0</b> / <b id="expNeed">1000</b></span></div>
  <div class="exp-track"><div class="exp-fill" id="expFill"></div></div>
</div>

<canvas id="burst"></canvas>
<div class="flash" id="flash"></div>
<div class="realm-up" id="realmUp"><div class="t" id="realmUpT">筑基</div><div class="s">天人感应 · 修为暴涨</div></div>

<div class="modal" id="offlineModal">
  <div class="card">
    <h3>游历归来</h3>
    <p id="offlineText">离线…</p>
    <div class="off-tale" id="offlineTale" style="display:none"></div>
    <button class="btn primary" onclick="closeOffline()">收下机缘</button>
  </div>
</div>

<div class="modal" id="storyModal">
  <div class="card story-card">
    <h3>修行录 · 我的仙途</h3>
    <p class="story-tip">这里只记下你亲身走过的路 —— 开篇、突破、离线游历，一步一迹。未历之境，仙途自不会提前示人。</p>
    <div class="chips-row" id="storyChips"></div>
    <div class="story-body" id="storyBody">
    </div>
    <button class="btn primary story-close" onclick="closeStory()">合上修行录</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
